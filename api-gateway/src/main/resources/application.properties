# Puerto donde escuchará el Gateway (Punto de entrada único)
server.port=8080

# Nombre de la aplicación para que aparezca en Eureka
spring.application.name=api-gateway

# Configuración del Cliente Eureka
eureka.client.service-url.defaultZone=http://localhost:8761/eureka/

# --- CONFIGURACIÓN DE RUTAS ---

# Ruta para el servicio de Pacientes
# Si alguien llama a http://localhost:8080/pacientes/** lo manda a paciente-service
spring.cloud.gateway.routes[0].id=paciente-service
spring.cloud.gateway.routes[0].uri=lb://paciente-service
spring.cloud.gateway.routes[0].predicates[0]=Path=/pacientes/**

# Ruta para el servicio de Recetas
# Si alguien llama a http://localhost:8080/recetas/** lo manda a receta-service
spring.cloud.gateway.routes[1].id=receta-service
spring.cloud.gateway.routes[1].uri=lb://receta-service
spring.cloud.gateway.routes[1].predicates[0]=Path=/recetas/**

# Habilitar el Discovery Locator (Permite crear rutas automáticas basadas en el nombre en Eureka)
spring.cloud.gateway.discovery.locator.enabled=true
spring.cloud.gateway.discovery.locator.lower-case-service-id=true